# KubeRay RayService: the Ray Serve inference app with zero-downtime upgrades.
#
#   kubectl -n ml apply -f infra/k8s/rayservice.yaml
#   kubectl -n ml port-forward svc/ml-serve-serve-svc 8000:8000
#   curl localhost:8000/health
#
# Contract: the Serve application object is `ml_platform.inference.serve:app`
# (the same import path `make serve` uses locally). It exposes POST /predict,
# POST /predict_batch, GET /health, GET /model-info and loads the MLflow model
# currently aliased `production`.
#
# Rolling model replacement: promoting a new model in the registry + bumping
# MODEL_ROLLOUT below (or any serveConfigV2 change) makes KubeRay update the
# Serve app in place; changing rayClusterConfig (e.g. a new image) makes it
# stand up a new cluster, wait for the app to be healthy, then switch the
# `-serve-svc` Service over (blue/green) and delete the old cluster.
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: ml-serve
  namespace: ml
  labels:
    app.kubernetes.io/part-of: ml-platform
spec:
  serveConfigV2: |
    proxy_location: EveryNode
    http_options:
      host: 0.0.0.0
      port: 8000
    applications:
      - name: ml-surrogate
        import_path: ml_platform.inference.serve:app
        route_prefix: /
        # Code is baked into the image; no working_dir upload.
        runtime_env:
          env_vars:
            ML_CONFIG: configs/distributed.yaml
            MLFLOW_TRACKING_URI: http://mlflow.ml.svc:5000
            MODEL_ROLLOUT: "1"
        # Per-deployment overrides (names are defined in serve.py), e.g.:
        # deployments:
        #   - name: SurrogateModel
        #     autoscaling_config:
        #       min_replicas: 1
        #       max_replicas: 8
        #       target_ongoing_requests: 16
        #     ray_actor_options: {num_cpus: 1, num_gpus: 0}   # num_gpus: 1 -> GPU group
  rayClusterConfig:
    rayVersion: "2.58.0"
    # Serve autoscaling adds replicas; the in-tree autoscaler adds worker pods
    # for them; the node autoscaler adds nodes for the pods.
    enableInTreeAutoscaling: true
    headGroupSpec:
      rayStartParams:
        num-cpus: "0"
        dashboard-host: "0.0.0.0"
        metrics-export-port: "8080"
      template:
        spec:
          nodeSelector:
            ml.io/pool: system
          containers:
            - name: ray-head
              image: ghcr.io/your-org/ml-platform:0.1.0
              ports:
                - {containerPort: 6379, name: gcs-server}
                - {containerPort: 8265, name: dashboard}
                - {containerPort: 10001, name: client}
                - {containerPort: 8000, name: serve}
                - {containerPort: 8080, name: metrics}
              resources:
                requests: {cpu: "2", memory: 8Gi}
                limits: {cpu: "2", memory: 8Gi}
    workerGroupSpecs:
      # Serving is latency-sensitive: keep replicas on on-demand nodes (no spot).
      - groupName: serve-cpu
        replicas: 1
        minReplicas: 1
        maxReplicas: 8
        rayStartParams:
          metrics-export-port: "8080"
        template:
          spec:
            nodeSelector:
              ml.io/pool: cpu-ondemand
            containers:
              - name: ray-worker
                image: ghcr.io/your-org/ml-platform:0.1.0
                ports:
                  - {containerPort: 8000, name: serve}
                  - {containerPort: 8080, name: metrics}
                resources:
                  requests: {cpu: "4", memory: 8Gi}
                  limits: {cpu: "4", memory: 8Gi}
      # Uncomment for GPU replicas (set num_gpus: 1 in ray_actor_options above).
      # - groupName: serve-gpu
      #   replicas: 0
      #   minReplicas: 0
      #   maxReplicas: 2
      #   rayStartParams: {metrics-export-port: "8080"}
      #   template:
      #     spec:
      #       nodeSelector: {ml.io/pool: gpu}
      #       tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
      #       containers:
      #         - name: ray-worker
      #           image: ghcr.io/your-org/ml-platform:0.1.0
      #           resources:
      #             requests: {cpu: "4", memory: 16Gi, nvidia.com/gpu: 1}
      #             limits: {cpu: "4", memory: 16Gi, nvidia.com/gpu: 1}
